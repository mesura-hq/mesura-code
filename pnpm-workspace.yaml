packages:
  - apps/*
  - infra/*
  - oxlint-plugin-t3code
  - packages/*
  - scripts
  # Symmetria: acceptance tests that exercise a package from outside it, by
  # spawning that package's own test command as a subprocess. They cannot live
  # inside the package they test: there the command collects them, they relaunch
  # the command, and the fan-out exhausts memory. This entry is what makes
  # `vp run -r test` and `vp run -r typecheck` reach them; without it they run by
  # hand only. It follows the precedent of `scripts` and `oxlint-plugin-t3code`,
  # and it is the one upstream line this work touches.
  - tests
  # Mesura: the Symmetria File Manager is vendored as a git subtree under
  # vendor/symmetria-file-manager. Only four of its packages are workspace
  # members: `app/` would install a second Electron beside the
  # desktop's. `fm-main` is the privileged half the server runs to host the
  # file manager's Miller view; its Electron-bound modules are never imported
  # from here. Runbook: docs/operations/vendor-symmetria-file-manager.md
  - vendor/symmetria-file-manager/packages/fm-core
  - vendor/symmetria-file-manager/packages/fm-ui
  - vendor/symmetria-file-manager/packages/fm-search
  - vendor/symmetria-file-manager/packages/fm-main

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false
  workerd: false

