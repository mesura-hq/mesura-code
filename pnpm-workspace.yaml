  "@expo/dom-webview": 57.0.1
  "@expo/metro-config": 57.0.12
  expo-constants: 57.0.16
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  expo-router: 57.0.17
  "expo-sharing>@expo/config-plugins": 57.0.9
  "expo-sharing>@expo/config-types": 57.0.2
  node-abi: 4.33.0
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@clerk/expo@*":
    dependencies:
      "@expo/config-plugins": 57.0.9
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-rc.112": patches/@effect__vitest@4.0.0-rc.112.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.3.0-beta.10": patches/@pierre%2Fdiffs@1.3.0-beta.10.patch
  # Mesura: sharp 0.35.0 declares `types` at the top level but omits it from its
  # `exports` map, so NodeNext resolution finds no declarations and every import
  # is an implicit any. The declarations ship; only the map is wrong.
  sharp@0.35.0: patches/sharp@0.35.0.patch
  dbus-next@0.10.2: patches/dbus-next@0.10.2.patch
  effect@4.0.0-rc.112: patches/effect@4.0.0-rc.112.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
